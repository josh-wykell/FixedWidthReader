plugins {
    id 'groovy'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

application {
    mainClass = 'fwreader.app.Main'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.groovy:groovy:4.0.14'
    implementation 'org.yaml:snakeyaml:1.29'
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

shadowJar {
    archiveBaseName = 'FixedWidthReader'
    archiveClassifier = ''
    archiveVersion = ''
    manifest {
        attributes 'Main-Class': 'fwreader.app.Main'
    }
}

tasks.register('jpackageApp', Exec) {
    dependsOn shadowJar
    def javaHome = System.getProperty('java.home')
    def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
    def jpackageBin = isWindows ? "${javaHome}/bin/jpackage.exe" : "${javaHome}/bin/jpackage"
    def jarPath = shadowJar.archiveFile.get().asFile.absolutePath
    def outputDir = layout.buildDirectory.dir('jpackage').get().asFile.absolutePath

    doFirst {
        file(outputDir).deleteDir()
    }

    def args = [
        jpackageBin,
        '--type',        isWindows ? 'exe' : 'pkg',
        '--name',        'FixedWidthReader',
        '--input',       file(jarPath).parent,
        '--main-jar',    file(jarPath).name,
        '--main-class',  'fwreader.app.Main',
        '--dest',        outputDir,
        '--app-version', '1.0',
    ]
    if (!isWindows) {
        args += ['--mac-package-name', 'FixedWidthReader']
    }
    commandLine args
}
